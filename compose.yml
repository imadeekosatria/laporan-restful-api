services:
  db:
    image: postgres:17.6-alpine
    container_name: database-laporan
    restart: always
    env_file:
      - .env.user
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - laporan-network
  server:
    container_name: server-laporan
    image: bun-server
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    develop:
      watch: 
        - action: rebuild
          path: .
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laporan-network
  
